[package]
name = "qrypton-types"
description = "Shared types for Qrypton Vault: withdrawal requests, signed-message format, policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# `alloc` enables the owned (Vec-backed) types used by off-chain crates.
alloc = []
std = ["alloc"]
# Off-chain helpers: strkey <-> XDR address conversion and network ids.
stellar = ["std", "dep:stellar-xdr", "dep:sha2"]

[dependencies]
stellar-xdr = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
# Enables the `stellar` feature for this crate's own tests.
qrypton-types = { path = ".", features = ["stellar"] }
