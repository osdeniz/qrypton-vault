name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · check · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain, components and wasm target.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test (skeleton tests are #[ignore]d)
        run: cargo test --workspace

  contract:
    name: soroban build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: stellar/stellar-cli@v28.1.0
      - name: stellar contract build
        run: stellar contract build --package qrypton-vault-contract
