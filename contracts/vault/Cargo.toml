[package]
name = "qrypton-vault-contract"
description = "Qrypton Vault: post-quantum (ML-DSA) institutional custody vault for Soroban."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
qrypton-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Off-chain encoder and signer, so tests check on-chain/off-chain agreement and
# verify fips204 signatures with the Soroban host's ML-DSA implementation.
qrypton-types = { workspace = true, features = ["stellar"] }
qrypton-signer = { workspace = true }
