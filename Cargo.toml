[workspace]
resolver = "2"
members = [
    "contracts/vault",
    "crates/qrypton-types",
    "crates/qrypton-signer",
    "crates/qrypton-sdk",
    "examples/anchor-reserve-withdrawal",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
publish = false
repository = "https://github.com/osdeniz/qrypton-vault"
authors = ["Ömer Salih Deniz"]

[workspace.dependencies]
# Pinned exactly. 30.x is the first release line with the CAP-0087 ML-DSA
# host functions (Protocol 30); contracts must be built with stellar-cli 30+.
soroban-sdk = { version = "=30.0.0" }

qrypton-types = { path = "crates/qrypton-types", default-features = false }
qrypton-signer = { path = "crates/qrypton-signer" }
qrypton-sdk = { path = "crates/qrypton-sdk" }

clap = { version = "4.6", features = ["derive"] }
# Same stellar-xdr release as soroban-sdk 30.0.0, so off-chain address
# encodings match what the contract produces with `Address::to_xdr`.
stellar-xdr = { version = "=30.0.0" }
sha2 = "0.10"
hex = "0.4"
# ML-DSA (FIPS 204) for off-chain signing. Deliberately a different
# implementation from the RustCrypto `ml-dsa` crate the Soroban host verifies
# with, so the compatibility tests compare two independent implementations.
fips204 = { version = "=0.5.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Soroban contracts are built with this profile (`stellar contract build`).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
